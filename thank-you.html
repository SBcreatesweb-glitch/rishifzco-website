<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Rishi International FZCO</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Inter', sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,.65),
                    rgba(0,0,0,.75)
                ),
                url("./images/warehouse.jpg");

            background-size: cover;
            background-position: center;

            color: #ffffff;
            text-align: center;
        }

        .thank-you-box {
            width: min(90%, 650px);
            padding: 55px 35px;

            background: rgba(15, 18, 23, .88);

            border: 1px solid rgba(255,255,255,.15);
            border-radius: 24px;

            backdrop-filter: blur(10px);

            box-shadow: 0 25px 60px rgba(0,0,0,.4);
        }

        .logo {
            width: 150px;
            margin-bottom: 30px;
        }

        .check {
            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff6b1a;

            border-radius: 50%;

            font-size: 36px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 20px;

            font-size: 42px;
            font-weight: 800;
        }

        p {
            margin: 0 auto 30px;

            max-width: 520px;

            color: #dddddd;

            font-size: 18px;
            line-height: 1.7;
        }

        .back-btn {
            display: inline-block;

            padding: 15px 32px;

            background: #ff6b1a;
            color: #ffffff;

            text-decoration: none;

            border-radius: 50px;

            font-size: 17px;
            font-weight: 700;

            transition: .3s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: #ff7b32;
        }

        @media (max-width: 600px) {

            .thank-you-box {
                padding: 40px 25px;
            }

            .logo {
                width: 125px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }

        }

    </style>
</head>

<body>

    <div class="thank-you-box">

        <img
            src="images/logo.png"
            alt="Rishi International FZCO"
            class="logo">

        <div class="check">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your enquiry has been received successfully.
            Our team will review your request and get back to you shortly.
        </p>

        <a href="https://rishifzco.com/" class="back-btn">
            Back to Website
        </a>

    </div>

</body>

</html>
